spring.application.name=Inventory

#connect mysql database on springboot
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopDb?createDatabaseIfNotExist = true
spring.datasource.username=root
spring.datasource.password=sasindu@16941
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
server.port=8085


spring.kafka.consumer.bootstrap-servers= localhost:9092
spring.kafka.consumer.group-id=inventory
# like buffer space to receive message
spring.kafka.consumer.auto-offset-reset= earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class = org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages =*
spring.kafka.template.default-topic=order_default_topic
